# Path-filtered CI for the RL-Scaling repo.
#
# What it does, in one pass per push/PR:
#   • Detects which top-level path changed.
#   • Always runs Python unit tests when controller / sdk code changed.
#   • Builds & pushes the rl-scaling-controller image when controller code,
#     deploy scripts, or this workflow changes.
#   • Triggers the dynamo fork's RL-Scaling build pipeline (via repository_dispatch)
#     when the user pushes a tag / commit that explicitly opts-in
#     (commit message contains `[dynamo-build]`) so we don't accidentally
#     waste a 30-minute GPU-image build on every controller-only change.
#   • Optional E2E job is gated on the label `run-e2e` (PRs) or pushes to main.
#
# All long-running stages have explicit cache + concurrency keys.

name: CI

on:
  push:
    branches: [main, RL-Scaling]
    tags: ["v*"]
  pull_request:
    branches: [main, RL-Scaling]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write          # for OIDC -> registry login

jobs:
  # ─── 1. detect what changed ────────────────────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      controller: ${{ steps.filter.outputs.controller }}
      sdk:        ${{ steps.filter.outputs.sdk }}
      deploy:     ${{ steps.filter.outputs.deploy }}
      docs:       ${{ steps.filter.outputs.docs }}
      ci:         ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            controller:
              - 'rl-scaling-controller/**'
            sdk:
              - 'rl-signal-sdk/**'
            deploy:
              - 'deploy/**'
              - 'test-scripts/**'
            docs:
              - '**/*.md'
            ci:
              - '.github/workflows/**'

  # ─── 2. unit tests ────────────────────────────────────────────────────────
  unit-tests:
    needs: changes
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.controller == 'true' ||
      needs.changes.outputs.sdk == 'true' ||
      needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - name: Install
        run: |
          python -m pip install -U pip
          python -m pip install -e ./rl-signal-sdk[test]
          python -m pip install -e ./rl-scaling-controller[test]
      - name: Run pytest
        run: python -m pytest rl-signal-sdk rl-scaling-controller -q --color=yes

  # ─── 3. build & push controller image ─────────────────────────────────────
  build-controller-image:
    needs: [changes, unit-tests]
    if: |
      always() && needs.unit-tests.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.controller == 'true' ||
       needs.changes.outputs.sdk == 'true' ||
       needs.changes.outputs.deploy == 'true' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/rl-scaling-controller
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        run: |
          echo "Pushed: ${REGISTRY}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  # ─── 4. trigger dynamo fork to build RL-Scaling worker image (opt-in) ─────
  trigger-dynamo-build:
    needs: changes
    if: |
      github.event_name == 'push' &&
      (contains(github.event.head_commit.message, '[dynamo-build]') ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DYNAMO_DISPATCH_TOKEN }}    # PAT with workflow scope on the fork
          repository: shqizhang/dynamo
          event-type: rl-scaling-build
          client-payload: |
            {"caller_sha":"${{ github.sha }}","caller_ref":"${{ github.ref }}"}

  # ─── 5. (optional) E2E on a self-hosted GPU runner ────────────────────────
  e2e:
    needs: build-controller-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, gpu, k3s]   # configure label on your runner
    steps:
      - uses: actions/checkout@v4
      - name: Apply controller using freshly built image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rl-scaling-controller:${{ github.sha }}
        run: |
          kubectl create ns dynamo --dry-run=client -o yaml | kubectl apply -f -
          IMAGE=${IMAGE} PUSH=false bash deploy/deploy-controller.sh
      - name: Run E2E (S1 only; S2/S3 require dual-mode worker)
        env:
          CONTROLLER_URL: http://localhost:8080
        run: |
          kubectl -n dynamo port-forward svc/rl-scaling-controller 8080:8080 &
          sleep 8
          bash test-scripts/test-s1.sh
