# RBAC for the controller: list DGDSAs and patch their /scale subresource.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rl-scaling-controller
  namespace: dynamo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rl-scaling-controller
rules:
  - apiGroups: ["dynamo.nvidia.com"]
    resources: ["dynamographdeploymentscalingadapters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["dynamo.nvidia.com"]
    resources: ["dynamographdeploymentscalingadapters/scale"]
    verbs: ["get", "patch", "update"]
  # Optional — allows describing target DGD and reading worker pods for diagnostics
  - apiGroups: ["dynamo.nvidia.com"]
    resources: ["dynamographdeployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rl-scaling-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rl-scaling-controller
subjects:
  - kind: ServiceAccount
    name: rl-scaling-controller
    namespace: dynamo
