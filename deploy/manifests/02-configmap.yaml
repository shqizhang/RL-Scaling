apiVersion: v1
kind: ConfigMap
metadata:
  name: rl-scaling-controller-config
  namespace: dynamo
data:
  # ── Connectivity ──
  DYNAMO_NAMESPACE: "dynamo-system"
  DGD_NAME: "vllm-v1-disagg-router"
  PROMETHEUS_URL: "http://prometheus-kube-prometheus-prometheus.monitoring:9090"
  WORKER_SIDECAR_PORT: "9091"

  # ── S1 ──
  PRE_WARM_THRESHOLD: "0.8"
  COOLDOWN_SECONDS: "30"
  CONTROL_LOOP_INTERVAL: "5"
  SINGLE_PREFILL_TPS: "50000"
  MAX_CONCURRENT_PER_DECODE: "64"
  TARGET_PREFILL_SECONDS: "5"
  MAX_GPUS: "8"
  MIN_PREFILL_REPLICAS: "1"
  MIN_DECODE_REPLICAS: "1"

  # ── S2 (disabled by default, opt-in) ──
  ROLE_SWITCH_ENABLED: "false"
  PREFILL_QUEUE_THRESHOLD: "10"
  DECODE_QUEUE_THRESHOLD: "10"
  DECODE_IDLE_THRESHOLD: "0.2"
  PREFILL_IDLE_THRESHOLD: "0.2"
  MIN_SWITCH_INTERVAL: "30"

  # ── S3 (disabled by default, opt-in) ──
  CONSOLIDATION_ENABLED: "false"
  CONSOLIDATION_THRESHOLD: "3"
  MIN_BATCH_COMPLETION: "0.6"
  PER_REQUEST_MIGRATION_OVERHEAD: "0.5"
  CONSOLIDATION_SCALE_DOWN_ENABLED: "true"
  CONSOLIDATION_STABLE_SAMPLES: "2"
  CONSOLIDATION_MIN_INTERVAL: "10"
  CONSOLIDATION_DRAIN_TIMEOUT: "20"
  CONSOLIDATION_DRAIN_POLL_INTERVAL: "2"
  K8S_SCALE_FALLBACK_ENABLED: "false"

  # ── HTTP ──
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "8080"
