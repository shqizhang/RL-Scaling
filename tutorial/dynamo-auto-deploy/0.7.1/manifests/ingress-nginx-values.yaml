# Helm values for ingress-nginx (static, no template variables)
controller:
  kind: DaemonSet
  hostPort:
    enabled: true
  service:
    type: ClusterIP
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: monitoring
  config:
    proxy-read-timeout: "3600"
    proxy-send-timeout: "3600"
    proxy-buffering: "off"
