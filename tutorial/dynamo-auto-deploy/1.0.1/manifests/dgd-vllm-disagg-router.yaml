# ============================================================
# dgd-vllm-disagg-router.yaml — Dynamo 1.0.1 disagg + KV router
#
# Architecture:
#   Frontend → KV Router (DYN_ROUTER_MODE=kv)
#     ├── VllmPrefillWorker (1 GPU, --disaggregation-mode prefill)
#     └── VllmDecodeWorker  (1 GPU, --disaggregation-mode decode,
#                            DYNAMO_RL_DUAL_MODE=1 → can flip to prefill
#                            at runtime via the in-process aiohttp
#                            sidecar's POST /switch_role).
#
# RL-Scaling additions on the decode worker:
#   * DYNAMO_RL_DUAL_MODE=1
#       Tells dynamo.vllm to wire a Reregistrar + a partner prefill
#       endpoint so /switch_role can re-publish this worker's MDC under
#       the prefill URI (true E2E routing flip, not just in-process role
#       state).
#   * --kv-transfer-config '{"kv_connector":"NixlConnector",...}'
#       vLLM 0.16 fixes the kv_transfer connector at engine construction;
#       it cannot be added later. Wire it at startup so the engine can
#       act as either decode or prefill after a flip.
#   * --kv-events-config zmq publisher
#       Lets the KV router know about cache events from this worker.
#
# Template variables (envsubst):
#   ${NAMESPACE}         K8s namespace
#   ${RELEASE_VERSION}   Image tag (eg. rl-scaling-844302352d)
#   ${MODEL_NAME}        HF model id  (eg. Qwen/Qwen3-0.6B)
#   ${PREFILL_REPLICAS}  Prefill replicas
#   ${DECODE_REPLICAS}   Decode replicas
# ============================================================
apiVersion: nvidia.com/v1alpha1
kind: DynamoGraphDeployment
metadata:
  name: vllm-v1-disagg-router
  namespace: ${NAMESPACE}
spec:
  services:
    Frontend:
      componentType: frontend
      replicas: 1
      envs:
        - name: DYN_ROUTER_MODE
          value: kv
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-imagepullsecret
          - name: ghcr-imagepullsecret
        mainContainer:
          image: ghcr.io/shqizhang/dynamo-vllm-runtime:${RELEASE_VERSION}
          imagePullPolicy: IfNotPresent

    VllmDecodeWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: ${DECODE_REPLICAS}
      envs:
        # RL-Scaling: turn on the dual-mode partner endpoint so
        # /switch_role truly re-registers this worker's MDC under the
        # prefill URI (not just in-process state).
        - name: DYNAMO_RL_DUAL_MODE
          value: "1"
        - name: DYNAMO_RL_SIDECAR_PORT
          value: "9091"
        # S2: serve a real partner-prefill endpoint after a D->P switch so
        # the frontend router actually dispatches prefill traffic to this
        # worker (without this the switch is in-process only and prefill
        # throughput does not improve).
        - name: DYNAMO_RL_DUAL_PARTNER_PREFILL
          value: "1"
        # S3: use the NIXL connector migration path (kv_transfer_params /
        # src_block_ids) instead of the recompute-prefill fallback.
        - name: DYNAMO_RL_CONNECTOR_ENABLED
          value: "1"
        # Allow AsyncLLM.collective_rpc to serialize the callable that
        # dual_mode uses to expire the NIXL connector's pending KV sends
        # before a role switch (releases blocks the switched-back decode
        # engine would otherwise keep pinned).
        - name: VLLM_ALLOW_INSECURE_SERIALIZATION
          value: "1"
      resources:
        limits:
          gpu: "1"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-imagepullsecret
          - name: ghcr-imagepullsecret
        mainContainer:
          image: ghcr.io/shqizhang/dynamo-vllm-runtime:${RELEASE_VERSION}
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - ${MODEL_NAME}
            - --disaggregation-mode
            - decode
            # vLLM 0.16 fixes kv_transfer at engine construction; wire
            # NixlConnector now so the engine can also act as prefill
            # after a hot role flip.
            - --kv-transfer-config
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - --kv-events-config
            - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'

    VllmPrefillWorker:
      envFromSecret: hf-token-secret
      componentType: worker
      replicas: ${PREFILL_REPLICAS}
      resources:
        limits:
          gpu: "1"
      extraPodSpec:
        imagePullSecrets:
          - name: nvcr-imagepullsecret
          - name: ghcr-imagepullsecret
        mainContainer:
          image: ghcr.io/shqizhang/dynamo-vllm-runtime:${RELEASE_VERSION}
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/examples/backends/vllm
          command:
            - python3
            - -m
            - dynamo.vllm
          args:
            - --model
            - ${MODEL_NAME}
            - --disaggregation-mode
            - prefill
            - --kv-transfer-config
            - '{"kv_connector":"NixlConnector","kv_role":"kv_both"}'
            - --kv-events-config
            - '{"publisher":"zmq","topic":"kv-events","endpoint":"tcp://*:20080","enable_kv_cache_events":true}'
